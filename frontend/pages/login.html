<!DOCTYPE html>
<!--
  Sign-in page. Self-contained (does not use assets/page-common.js, which is
  reserved for the secondary account pages — see that file's header comment).
  Follows the same header markup convention documented at the top of
  /index.html; asset script order: firebase-config.js, auth.js, i18n.js, api.js.
-->
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | GeoIntel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/style.css">

    <style>
        .login-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: var(--bg-page);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            box-shadow: var(--card-shadow-hover);
            overflow: hidden;
        }
        .login-card-header {
            background: var(--bg-header);
            color: #fff;
            padding: 1.5rem;
            text-align: center;
        }
        .login-card-header .brand-logo-icon { margin: 0 auto 0.75rem auto; }
        .login-card-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .login-btn-google {
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
            width: 100%; padding: 0.65rem 1rem; border-radius: var(--radius-sm);
            border: 1px solid var(--card-border); background: var(--bg-surface);
            color: var(--text-primary); font-weight: 600; font-size: 0.85rem; cursor: pointer;
            transition: var(--transition);
        }
        .login-btn-google:hover { background: var(--table-header-bg); border-color: var(--primary-border); }
        .login-divider { display: flex; align-items: center; gap: 0.75rem; color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; }
        .login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--card-border); }
        .login-field { display: flex; flex-direction: column; gap: 0.35rem; }
        .login-field label { font-size: 0.76rem; color: var(--text-secondary); font-weight: 500; }
        .login-field input {
            padding: 0.55rem 0.7rem; border-radius: var(--radius-sm); border: 1px solid var(--card-border);
            background: var(--bg-page); color: var(--text-primary); font-family: inherit; font-size: 0.85rem;
        }
        .login-btn-primary {
            padding: 0.65rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--primary);
            background: var(--primary); color: #fff; font-weight: 600; font-size: 0.85rem; cursor: pointer;
            transition: var(--transition);
        }
        .login-btn-primary:hover { background: var(--primary-hover); }
        .login-notice {
            font-size: 0.78rem; padding: 0.65rem 0.8rem; border-radius: var(--radius-sm);
            background: var(--status-info-bg); color: var(--status-info-text); border: 1px solid var(--status-info-border);
        }
        .login-notice.warn {
            background: var(--status-warning-bg); color: var(--status-warning-text); border-color: var(--status-warning-border);
        }
        .login-back { text-align: center; font-size: 0.78rem; }
        .login-back a { color: var(--secondary); text-decoration: none; }
        .login-back a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header class="header-top">
        <div class="header-left">
            <a href="/" class="brand-container">
                <div class="brand-logo-icon">
                    <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </div>
                <div class="brand-title-wrap">
                    <div class="brand-name">Geo<span class="intel">Intel</span></div>
                    <div class="brand-tag" data-i18n="brand.tag">Мониторинг засухи</div>
                </div>
            </a>
        </div>
        <div class="header-right">
            <button class="theme-toggle-btn" id="themeToggle" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
                <svg class="icon icon-sun" id="themeSun" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon icon-moon" id="themeMoon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </header>

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-card-header">
                <div class="brand-logo-icon" style="width:44px;height:44px;">
                    <svg class="icon icon-lg" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </div>
                <div style="font-size:1.1rem;font-weight:700;">Geo<span style="color:#90caf9;font-weight:400;">Intel</span></div>
                <div style="font-size:0.78rem;color:var(--header-subtext);margin-top:0.2rem;" data-i18n="nav.login">Войти</div>
            </div>
            <div class="login-card-body" id="loginBody">
                <!-- Filled by script: either the sign-in form or a "not configured" notice -->
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <svg class="icon" viewBox="0 0 24 24" style="color: var(--accent-gold);"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toastMsg">—</span>
    </div>

    <script src="/assets/firebase-config.js"></script>
    <script src="/assets/auth.js"></script>
    <script src="/assets/i18n.js"></script>
    <script src="/assets/api.js"></script>

    <script>
        function initTheme() {
            const saved = window.localStorage.getItem('geointel_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            const isDark = saved === 'dark';
            document.getElementById('themeSun').style.display = isDark ? 'block' : 'none';
            document.getElementById('themeMoon').style.display = isDark ? 'none' : 'block';
            document.getElementById('themeToggle').addEventListener('click', () => {
                const cur = document.documentElement.getAttribute('data-theme') || 'light';
                const next = cur === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                window.localStorage.setItem('geointel_theme', next);
                document.getElementById('themeSun').style.display = next === 'dark' ? 'block' : 'none';
                document.getElementById('themeMoon').style.display = next === 'dark' ? 'none' : 'block';
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            toast.classList.add('show');
            clearTimeout(window.__loginToastTimer);
            window.__loginToastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
        }

        function getRedirectTarget() {
            const params = new URLSearchParams(window.location.search);
            return params.get('next') || '/';
        }

        function renderSignedIn(user) {
            const body = document.getElementById('loginBody');
            const label = user.displayName || user.email || 'User';
            body.innerHTML = `
                <div class="login-notice">Signed in as <strong>${label}</strong>.</div>
                <a class="login-btn-primary" style="text-align:center;text-decoration:none;" href="${getRedirectTarget()}" data-i18n="common.back_to_dashboard">На панель управления</a>
                <button class="login-btn-google" id="signOutBtn"><span data-i18n="nav.logout">Выйти</span></button>
            `;
            document.getElementById('signOutBtn').addEventListener('click', async () => {
                await window.geointelAuth.signOutUser();
            });
            window.GeoIntelI18n.applyTranslations();
        }

        function renderNotConfigured() {
            const body = document.getElementById('loginBody');
            body.innerHTML = `
                <div class="login-notice warn" data-i18n="auth.not_configured">Вход временно недоступен: Firebase не настроен.</div>
                <p style="font-size:0.78rem;color:var(--text-secondary);">
                    Public dashboard data is still available without signing in.
                </p>
                <div class="login-back"><a href="/" data-i18n="common.back_to_dashboard">На панель управления</a></div>
            `;
            window.GeoIntelI18n.applyTranslations();
        }

        function renderSignInForm() {
            const body = document.getElementById('loginBody');
            body.innerHTML = `
                <button class="login-btn-google" id="googleBtn">
                    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.1 26.9 36 24 36c-5.3 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.6 5.6C41.8 35.6 44 30.2 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
                    <span data-i18n="action.sign_in_google">Войти через Google</span>
                </button>
                <div class="login-divider">or</div>
                <form id="emailForm" style="display:flex;flex-direction:column;gap:0.75rem;">
                    <div class="login-field">
                        <label for="emailInput" data-i18n="action.sign_in_email">Войти по ссылке на почту</label>
                        <input type="email" id="emailInput" placeholder="you@example.com" required>
                    </div>
                    <button class="login-btn-primary" type="submit"><span data-i18n="action.send_link">Отправить ссылку</span></button>
                </form>
                <div class="login-back"><a href="/" data-i18n="common.back_to_dashboard">На панель управления</a></div>
            `;
            window.GeoIntelI18n.applyTranslations();

            document.getElementById('googleBtn').addEventListener('click', async () => {
                try {
                    await window.geointelAuth.signInWithGoogle();
                } catch (e) {
                    showToast(e.message || 'Sign-in failed');
                }
            });

            document.getElementById('emailForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('emailInput').value.trim();
                if (!email) return;
                try {
                    await window.geointelAuth.sendEmailLink(email);
                    showToast(window.GeoIntelI18n.t('action.send_link') + ' ✓');
                } catch (err) {
                    showToast(err.message || 'Failed to send link');
                }
            });
        }

        async function initAuthArea() {
            if (!window.geointelAuth.isConfigured) {
                renderNotConfigured();
                return;
            }
            await window.geointelAuth.ready;
            if (window.geointelAuth.currentUser) {
                renderSignedIn(window.geointelAuth.currentUser);
            } else {
                renderSignInForm();
            }
            window.geointelAuth.onAuthChange((user) => {
                if (user) renderSignedIn(user);
                else renderSignInForm();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initAuthArea();
        });
    </script>
</body>
</html>
