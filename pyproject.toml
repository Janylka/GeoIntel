[project]
name = "geointel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "psycopg2-binary",
    "geoalchemy2",
    "alembic",
    "pydantic-settings",
    "pydantic>=2.0",
    "python-dotenv",
    "earthengine-api>=1.7.39",
    "google-auth>=2.56.3",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP042", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["geointel"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "geointel.domain.*",
    "geointel.contracts.*",
]
strict = true
