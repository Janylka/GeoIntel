[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geointel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "geoalchemy2",
    "alembic",
    "pydantic-settings",
    "pydantic>=2.0",
    "python-dotenv",
    "earthengine-api>=1.7.39",
    "firebase-admin>=7.5.0",
    "resend>=2.36.0",
    "fpdf2>=2.8.8",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["geointel*"]

[tool.uv.sources]
geointel = { path = ".", editable = true }

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["geointel"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "geointel.domain.*",
    "geointel.contracts.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["firebase_admin.*"]
ignore_missing_imports = true
