# A generic Alembic configuration file.
#
# Refer to the Alembic documentation at http://alembic.sqlalchemy.org
# for complete documentation.

[alembic]
# path to migration scripts
script_location = geointel/db/migrations

# template for new migration files
file_template = %%(rev)s_%%(slug)s

# The database URL is read from the DATABASE_URL environment variable
# in geointel/db/migrations/env.py.
# This is a fallback for other tools.
sqlalchemy.url = postgresql://user:password@localhost:5432/geointel

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S